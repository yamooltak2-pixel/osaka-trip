          title: '예상 → 실제 전환',
          body: '<p class="small">같은 항목을 실제 결제로 바꿉니다. 새 항목이 생기지 않으므로 두 번 더해지지 않습니다.</p>' +
            '<label for="cv-amount">실제 결제 금액 (' + esc(item.currency === 'JPY' ? '엔' : '원') + ')</label>' +
            '<input id="cv-amount" type="number" inputmode="numeric" value="' + esc(item.amount === null ? '' : item.amount) + '">' +
            '<p class="hint">예상 금액: ' + esc(C.fmtMoney(item.amount, item.currency)) + '</p>',
          actions: [{ label: '취소', act: 'close' }, { label: '전환', act: 'do-convert', cls: 'btn-primary' }],
          onAction: function (a) {
            if (a === 'close') return closeDlg();
            var v = document.getElementById('cv-amount').value;
            commit(function (st) { C.estimateToActual(st.budget, id, v === '' ? null : Number(v)); });
            closeDlg();
            toast('실제 결제로 전환했습니다.');
          }
        });
        return;
      }
      case 'budget-settings-save': {
        var f = document.getElementById('budget-form');
        var target = Number(f.querySelector('[name=target]').value) || 0;
        var buffer = Number(f.querySelector('[name=buffer]').value) || 0;
        var rateRaw = f.querySelector('[name=rate]').value;
        commit(function (st) {
          st.budget.targetKrw = target;
          st.budget.bufferPct = buffer;
          st.budget.jpyRate = rateRaw === '' ? null : Number(rateRaw);
        });
        toast('목표 예산을 저장했습니다.');
        return;
      }
      case 'check-toggle': {
        commit(function (st) {
          st.checklist.forEach(function (k) { if (k.id === id) k.done = !k.done; });
        });
        return;
      }
      case 'check-del': {
        if (!guard('kdel:' + id, 900)) return;
        commit(function (st) { st.checklist = st.checklist.filter(function (k) { return k.id !== id; }); });
        return;
      }
      case 'check-add':
        openDlg({
          title: '체크리스트 항목 추가',
          body: '<label for="ck-new">할 일</label><input id="ck-new" type="text" name="text">',
          actions: [{ label: '취소', act: 'close' }, { label: '추가', act: 'do-check-add', cls: 'btn-primary' }],
          onAction: function (a) {
            if (a === 'close') return closeDlg();
            var v = document.getElementById('ck-new').value.trim();
            if (!v) return;
            commit(function (st) { st.checklist.push({ id: C.uid('k'), text: v, done: false }); });
            closeDlg();
          }
        });
        return;
      case 'conf-toggle': {
        commit(function (st) {
          st.confirmations.forEach(function (q) { if (q.id === id) q.done = !q.done; });
        });
        return;
      }
      case 'alt-apply':
        applyAlternative(id);
        return;
      case 'export':
        exportJson(!!(document.getElementById('exp-personal') && document.getElementById('exp-personal').checked));
        return;
      case 'import-pick':
        document.getElementById('import-file').click();
        return;
      case 'trash-restore': {
        if (!guard('trrestore:' + id, 900)) return;
        var r = null;
        commit(function (st) { r = C.restoreTrash(st, id); });
        if (r && r.ok) toast('복원했습니다.');
        else if (r) toast(r.reason || '복원하지 못했습니다.');
        return;
      }
      case 'trash-empty':
        openEmptyTrash();
        return;
      case 'ics':
        download('osaka-trip-' + stampName() + '.ics', C.buildICS(S, utcStampNow()), 'text/calendar');
        toast('캘린더 파일을 만들었습니다. 파일을 열어 일정을 추가하세요.');
        return;
      case 'reset-all':
        openReset();
        return;
      case 'conflict-load':
        if (conflict) {
          S = conflict;
          baseRev = S.revision;
          conflict = null;
          render();
          toast('다른 창의 내용을 불러왔습니다.');
        }
        return;
      case 'conflict-merge':
        if (conflict) {
          var merged = C.mergeStates(S, conflict);
          S = merged.state;
          conflict = null;
          S.revision = baseRev + 1;
          writeNow();
          render();
          toast('합쳐서 저장했습니다. 새 항목 ' + (merged.report.addedItems + merged.report.addedCandidates) + '개 추가.');
        }
        return;
      case 'recovery-restore': {
        var raw2 = safeGet(C.RECOVERY_KEY);
        if (!raw2) { toast('복구본이 없습니다.'); return; }
        openDlg({
          title: '복구본으로 되돌리기',
          body: '<p class="small">지금 상태를 백업한 뒤 복구본으로 되돌립니다. 되돌린 뒤에도 다시 복구본을 만들 수 있습니다.</p>' +
            '<label class="check"><input type="checkbox" id="rc-backup" checked><span>지금 상태를 먼저 백업 파일로 내려받습니다</span></label>',
          actions: [{ label: '취소', act: 'close' }, { label: '되돌리기', act: 'do-recovery', cls: 'btn-warn' }],
          onAction: function (act) {
            if (act === 'close') return closeDlg();
            if (act !== 'do-recovery') return;
            var cb = document.getElementById('rc-backup');
            if (cb && cb.checked) exportJson(false);
            try {
              var rec = JSON.parse(raw2);
              safeSet(C.RECOVERY_KEY, JSON.stringify({ at: new Date().toISOString(), mode: '되돌리기 직전', state: C.clone(S) }));
              S = rec.state;
              S.revision = baseRev + 1;
              writeNow();
              closeDlg();
              render({ top: true });
              toast('복구본으로 되돌렸습니다.');
            } catch (e) { toast('복구본을 읽지 못했습니다.'); }
          }
        });
        return;
      }
      case 'import-undo': {
        var raw = safeGet(C.RECOVERY_KEY);
        if (!raw) { toast('복구본이 없습니다.'); return; }
        try {
          var rec = JSON.parse(raw);
          S = rec.state;
          S.revision = baseRev + 1;
          writeNow();
          render();
          toast('가져오기 이전 상태로 되돌렸습니다.');
        } catch (e) { toast('복구본을 읽지 못했습니다.'); }
        return;
      }
      default:
        return;
    }
  }

  function applyAlternative(altId) {
    var a = S.alternatives.filter(function (x) { return x.id === altId; })[0];
    if (!a) return;
    var day = C.findDay(S, a.dayDate);
    if (!day) return;
    openDlg({
      title: '대안을 일정에 반영할까요?',
      body: '<p class="small">' + esc(a.title) + '</p>' +
        '<p>현재 ' + esc(C.dateLabel(day.date, day.weekday)) + ' 일정 ' + day.items.length + '개를 대안 항목으로 바꿉니다.</p>' +
        '<div class="banner warn"><p class="small">지금 상태는 백업(복구본)에 저장됩니다. 바꾼 뒤 ‘가져오기 취소’ 대신 일정에서 되돌리거나, 먼저 백업 파일을 받아 두세요.</p></div>',
      actions: [{ label: '취소', act: 'close' }, { label: '백업', act: 'export' }, { label: '반영', act: 'do-alt', cls: 'btn-warn' }],
      onAction: function (act) {
        if (act === 'close') return closeDlg();
        if (act === 'export') { exportJson(false); return; }
        safeSet(C.RECOVERY_KEY, JSON.stringify({ at: new Date().toISOString(), mode: 'alternative', state: C.clone(S) }));
        commit(function () {
          day.items = a.steps.map(function (s, i) {
            return {
              id: C.uid('it'), time: '', endTime: '', name: s, kind: 'visit', badge: 'optional',
              origin: '대안', stay: '', address: '', hours: '', booking: '', note: '',
              details: '', travel: { mode: '도보', min: 0, source: '확인 필요', stale: true },
              access: {}, links: {}, skip: 'rain', status: 'planned', order: i
            };
          });
          day.note = '대안 반영: ' + a.title + ' (시각은 직접 채워야 합니다)';
        });
        closeDlg();
        toast('대안을 반영했습니다. 시각은 직접 채워 넣으세요.');
      }
    });
  }

  function openEmptyTrash() {
    var n = (S.trash || []).length;
    openDlg({
      title: '휴지통 비우기',
      body: '<p>휴지통의 ' + n + '개 항목을 완전히 지웁니다. 되돌릴 수 없습니다.</p>' +
        '<label class="check"><input type="checkbox" id="tr-backup"><span>먼저 백업 파일을 내려받았습니다</span></label>',
      actions: [{ label: '취소', act: 'close' }, { label: '백업 내려받기', act: 'export' }, { label: '비우기', act: 'do-empty', cls: 'btn-danger' }],
      onAction: function (act) {
        if (act === 'close') return closeDlg();
        if (act === 'export') { exportJson(false); return; }
        if (act !== 'do-empty') return;
        var cb = document.getElementById('tr-backup');
        if (!cb || !cb.checked) { toast('백업을 먼저 받고 체크해 주세요.'); return; }
        var res = null;
        commit(function (st) { res = C.emptyTrash(st, true); });
        closeDlg();
        toast('휴지통을 비웠습니다.');
      }
    });
  }

  function openCandToDay(candId) {
    var c = S.candidates.filter(function (x) { return x.id === candId; })[0];
    if (!c) return;
    openDlg({
      title: '일정에 넣기',
      body: '<p class="small">' + esc(c.name) + '</p>' +
        '<label for="cd-date">날짜</label><select id="cd-date" name="date">' +
        S.days.map(function (d) {
          return '<option value="' + d.date + '">' + esc(C.dateLabel(d.date, d.weekday)) + ' — ' + esc(d.title) + '</option>';
        }).join('') + '</select>' +
        '<label for="cd-time">시작 시각</label><input id="cd-time" type="time" value="10:00">',
      actions: [{ label: '취소', act: 'close' }, { label: '넣기', act: 'do-cand', cls: 'btn-primary' }],
      onAction: function (act) {
        if (act === 'close') return closeDlg();
        var date = document.getElementById('cd-date').value;
        var time = document.getElementById('cd-time').value;
        commit(function (st) {
          var day = C.findDay(st, date);
          day.items.push({
            id: C.uid('it'), time: time, endTime: '', name: c.name, kind: c.kind || 'visit',
            badge: 'optional', origin: '후보에서 추가', stay: c.stay || '', address: c.address || '',
            phone: c.phone || '', hours: c.hours || '', booking: c.booking || '',
            note: c.note || '', details: c.details || '', travel: c.travel || { mode: '도보', min: null, source: '확인 필요', stale: true },
            access: c.access || {}, links: c.links || {}, skip: 'none', status: 'planned'
          });
          C.reindex(day);
          C.markTravelStale(day, day.items.length - 1);
          st.candidates = st.candidates.filter(function (x) { return x.id !== candId; });
          st.settings.activeDate = date;
        });
        closeDlg();
        toast('일정에 넣었습니다. 순서와 이동시간을 확인하세요.');
      }
    });
  }

  function copyText(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('주소를 복사했습니다.'); },
        function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('주소를 복사했습니다.'); }
    catch (e) { toast('복사하지 못했습니다. 길게 눌러 직접 복사하세요.'); }
    document.body.removeChild(ta);
  }

  /* ---------------- 시작 ---------------- */
  function bind() {
    document.addEventListener('click', handleClick);
    document.addEventListener('change', function (ev) {
      if (ev.target && ev.target.id === 'import-file' && ev.target.files && ev.target.files[0]) {
        handleImportFile(ev.target.files[0]);
        ev.target.value = '';
      }
    });
    document.getElementById('dlg-foot').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-dlg]');
      if (!b) return;
      dlgHandler(b.getAttribute('data-dlg'));
    });
    document.getElementById('dlg').addEventListener('click', function (ev) {
      if (ev.target === document.getElementById('dlg')) closeDlg();
    });
    window.addEventListener('storage', function (ev) {
      if (ev.key === C.STORAGE_KEY && ev.newValue) {
        try {
          var incoming = JSON.parse(ev.newValue);
          if (incoming && C.detectConflict(baseRev, incoming.revision)) {
            conflict = incoming;
            renderConflict();
            toast('다른 창에서 수정했습니다. 덮어쓰지 않았습니다.');
          }
        } catch (e) { }
      } else if (ev.key === C.PERSONAL_KEY && ev.newValue) {
        try { var p = JSON.parse(ev.newValue); if (p) { P = p; render(); } } catch (e) { }
      }
    });
    document.getElementById('tabbar').addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-tab]');
      if (b) go(b.getAttribute('data-tab'));
    });
  }

  loadAll();
  bind();
  render();
})();
</script>
</body>
</html>
