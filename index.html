<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오사카 가족 여행 2026 · 12/15~18</title>
<meta name="description" content="2026년 12월 15일~18일 오사카 6인 가족 여행 일정·예약·예산·준비물 안내. 이 기기에만 저장되는 오프라인 여행 앱입니다.">
<meta name="theme-color" content="#0d2b4e">
<meta name="robots" content="noindex, nofollow">
<style>
/* =========================================================
   오사카 가족 여행 안내 — 모바일 우선 스타일
   설계 기준: 최소 폭 360px에서 가로 넘침 0, 본문 17px, 터치 48px
   ========================================================= */
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --ink:#14181f;
  --ink-2:#3d444d;
  --ink-3:#5b636d;
  --line:#c9d0d8;
  --line-2:#e3e7ec;
  --accent:#0b4f9e;
  --accent-ink:#083a75;
  --accent-soft:#e8f0fb;
  --ok:#0d6b3c;
  --ok-soft:#e6f4ec;
  --warn:#8a4b00;
  --warn-soft:#fdf0dd;
  --danger:#a3121b;
  --danger-soft:#fdeaea;
  --neutral-soft:#eef1f4;
  --focus:#0b4f9e;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,24,31,.08), 0 2px 8px rgba(20,24,31,.06);
  --fs:17px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;max-width:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:var(--fs);
  line-height:1.6;
  overflow-wrap:anywhere;
  word-break:keep-all;
  padding-bottom:96px;
}
h1,h2,h3,h4{margin:0;line-height:1.35;font-weight:800;letter-spacing:-.01em}
h1{font-size:23px}
h2{font-size:20px}
h3{font-size:18px}
h4{font-size:17px}
p{margin:.5em 0}
a{color:var(--accent-ink)}
ul,ol{margin:.4em 0;padding-left:1.15em}
li{margin:.2em 0}
small,.small{font-size:14px;line-height:1.5}
.muted{color:var(--ink-3)}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}
.skip-link{position:absolute;left:-9999px;top:0;background:#fff;padding:10px;z-index:99}
.skip-link:focus{left:8px;top:8px}

/* ---------- 상단 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:#0d2b4e;color:#fff;
  padding:10px 0 8px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.topbar h1{font-size:19px;color:#fff}
.topbar .sub{font-size:14px;color:#d5e3f5;margin-top:2px}
.savechip{
  display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:8px;font-size:14px;font-weight:700;
  padding:6px 10px;border-radius:999px;background:#1b4570;color:#fff;
  border:1px solid #3a6c9f;min-height:36px;
}
.savechip.state-saving{background:#5a4708;border-color:#8a6f11}
.savechip.state-saved{background:#0d4d2c;border-color:#2f7b52}
.savechip.state-failed{background:#6b1218;border-color:#a8303a}
.savechip .dot{width:9px;height:9px;border-radius:50%;background:#9fe3b9}
.savechip.state-saving .dot{background:#ffd479}
.savechip.state-failed .dot{background:#ffb3b8}

/* ---------- 배너/알림 ---------- */
.banner{
  border-radius:var(--radius);padding:12px 14px;margin:12px 0;
  border:2px solid;font-size:16px;
}
.banner h4{margin-bottom:6px}
.banner.info{background:var(--accent-soft);border-color:#9dbfe8;color:#0a2f5e}
.banner.warn{background:var(--warn-soft);border-color:#d8a05a;color:#5b3400}
.banner.danger{background:var(--danger-soft);border-color:#d89399;color:#6d0d13}
.banner.ok{background:var(--ok-soft);border-color:#8ec4a8;color:#0a4c2b}
.banner .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- 카드 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin:12px 0;box-shadow:var(--shadow);
}
.card.tight{padding:11px 12px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h3,.card-head h4{min-width:0}

/* ---------- 배지 ---------- */
.badge{
  display:inline-block;font-size:14px;font-weight:800;line-height:1.3;
  padding:4px 9px;border-radius:8px;border:1.5px solid;white-space:nowrap;
}
.badge.confirmed{background:var(--ok-soft);color:#07552f;border-color:#7fbb9c}
.badge.planned{background:var(--accent-soft);color:#083d78;border-color:#9dbfe8}
.badge.optional{background:#f3eefb;color:#4b2a7a;border-color:#bda8dd}
.badge.needs_check{background:var(--warn-soft);color:#6b3a00;border-color:#d8a05a}
.badge.cancelled{background:#efe9e9;color:#6d2a30;border-color:#c9a6aa;text-decoration:line-through}
.badge.plain{background:var(--neutral-soft);color:var(--ink-2);border-color:#c2cad3;white-space:normal}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.badge.sm{font-size:13px;padding:2px 7px}

/* ---------- 버튼 ---------- */
button,.btn{
  font:inherit;font-size:16px;font-weight:700;
  min-height:48px;padding:11px 14px;border-radius:12px;
  border:2px solid var(--line);background:#fff;color:var(--ink);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  text-decoration:none;text-align:center;line-height:1.3;
  -webkit-tap-highlight-color:transparent;
}
button:active,.btn:active{transform:translateY(1px)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px;
}
button[disabled],.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-soft{background:var(--accent-soft);border-color:#9dbfe8;color:#083d78}
.btn-warn{background:var(--warn-soft);border-color:#d8a05a;color:#5b3400}
.btn-danger{background:var(--danger-soft);border-color:#d89399;color:#7a0e14}
.btn-ok{background:var(--ok-soft);border-color:#8ec4a8;color:#0a4c2b}
.btn-sm{font-size:15px;min-height:44px;padding:8px 11px;border-radius:10px}
.btn-block{width:100%}
.btn-icon{min-width:48px;padding:11px 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.tight{gap:6px}
.row-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.spacer{flex:1 1 auto}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;min-height:44px;padding:8px 13px;border-radius:999px;
  border:2px solid var(--line);background:#fff;font-size:15px;font-weight:700;color:var(--ink-2);
}
.tab[aria-selected="true"]{background:#0d2b4e;border-color:#0d2b4e;color:#fff}

/* ---------- 하단 내비 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#fff;border-top:2px solid var(--line);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  padding:4px 2px calc(4px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 10px rgba(0,0,0,.07);
}
.tabbar button{
  border:none;background:transparent;border-radius:10px;
  min-height:52px;padding:4px 2px;font-size:14px;font-weight:800;color:var(--ink-3);
  flex-direction:column;gap:2px;
}
.tabbar button[aria-current="page"]{color:var(--accent-ink);background:var(--accent-soft)}
.tabbar .ico{font-size:17px;line-height:1}

/* ---------- 폼 ---------- */
label{display:block;font-weight:700;font-size:15px;margin:10px 0 4px;color:var(--ink-2)}
input[type=text],input[type=time],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;font:inherit;font-size:16px;min-height:48px;padding:10px 12px;
  border:2px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);
  max-width:100%;
}
textarea{min-height:88px;resize:vertical}
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;min-height:48px}
.check input{width:24px;height:24px;margin:2px 0 0;flex:0 0 auto}
.check span{flex:1 1 auto;font-weight:600;font-size:16px}
.check.done span{text-decoration:line-through;color:var(--ink-3)}
fieldset{border:2px solid var(--line-2);border-radius:12px;padding:8px 12px 12px;margin:10px 0}
legend{font-weight:800;font-size:15px;padding:0 6px;color:var(--ink-2)}
.hint{font-size:14px;color:var(--ink-3);margin:4px 0 0;line-height:1.5}

/* ---------- 일정 아이템 ---------- */
.item{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:12px;margin:10px 0;box-shadow:0 1px 2px rgba(20,24,31,.05);
}
.item.done{border-color:#8ec4a8;background:#fbfffc}
.item.skipped{opacity:.82;border-style:dashed}
.item.is-deadline{border-left:6px solid var(--danger);padding-left:10px}
.item.is-confirmed{border-left:6px solid var(--ok)}
.item-time{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-weight:800;font-size:16px;color:var(--accent-ink);
}
.item-time .stay{font-weight:600;color:var(--ink-3);font-size:14px}
.item-name{font-size:18px;font-weight:800;margin:2px 0 0}
.item-meta{font-size:15px;color:var(--ink-2);margin-top:6px}
.item-meta dt{font-weight:800;color:var(--ink);display:inline}
.item-meta .line{display:block;margin-top:3px}
.travel{
  display:flex;gap:8px;align-items:flex-start;font-size:14px;
  background:var(--neutral-soft);border-radius:9px;padding:6px 9px;margin:8px 0 0;color:var(--ink-2);
}
.travel.stale{background:var(--warn-soft);color:#5b3400;border:1px dashed #d8a05a}
.notice{
  border-radius:10px;padding:8px 10px;margin-top:8px;font-size:15px;border:1px solid;
}
.notice.danger{background:var(--danger-soft);border-color:#d89399;color:#6d0d13}
.notice.warn{background:var(--warn-soft);border-color:#d8a05a;color:#5b3400}
.notice.info{background:var(--accent-soft);border-color:#9dbfe8;color:#0a2f5e}
.items{list-style:none;padding:0;margin:0}

/* ---------- 접기 ---------- */
details{
  border:1px solid var(--line-2);border-radius:11px;background:#fcfdfe;margin:8px 0;padding:0 12px;
}
details[open]{padding-bottom:10px}
summary{
  cursor:pointer;font-weight:800;font-size:16px;padding:10px 0;min-height:44px;
  display:flex;align-items:center;gap:8px;list-style:none;
}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--accent);font-size:15px}
details[open]>summary::before{content:"▾"}
details .body{font-size:16px;color:var(--ink-2)}

/* ---------- 지도 링크 그리드 ---------- */
.maplinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.maplinks .btn{font-size:15px;min-height:46px;padding:8px 6px}
.maplinks .full{grid-column:1 / -1}
.drive-note{font-size:13.5px;color:var(--ink-3);margin-top:6px;line-height:1.45}

/* ---------- 주요 장소 지도 (Leaflet + OpenStreetMap) ---------- */
.map-quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.map-quick .btn{font-size:15px;min-height:46px;padding:8px 4px;gap:4px;white-space:nowrap}
.map-quick .btn:active,.map-quick .btn.on{background:var(--accent-soft);border-color:#9dbfe8;color:#083d78}
.trip-map{
  position:relative;z-index:0;height:280px;border-radius:12px;overflow:hidden;
  border:1px solid var(--line);background:#e9eef3;
}
.trip-map .leaflet-container{font:inherit;background:#e9eef3}
.trip-map .leaflet-control-zoom a.leaflet-control-zoom-in,
.trip-map .leaflet-control-zoom a.leaflet-control-zoom-out{width:44px;height:44px;line-height:42px;font-size:22px;font-weight:800}
.trip-map .leaflet-popup-content{font-size:14.5px;line-height:1.45;margin:10px 12px}
.trip-map .leaflet-popup-content-wrapper{border-radius:11px}
.map-pin{
  display:flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:50%;background:#fff;border:3px solid var(--accent);
  box-shadow:0 3px 9px rgba(0,0,0,.35);font-size:19px;line-height:1;
}
.map-pin.hotel{border-color:#0b4f9e}
.map-pin.kix{border-color:#0d6b3c}
.map-pin.usj{border-color:#8a2f9e}
.map-pin-label{
  background:#0d2b4e;color:#fff;border:none;border-radius:8px;padding:2px 7px;
  font-size:12.5px;font-weight:800;line-height:1.35;box-shadow:0 2px 6px rgba(0,0,0,.28);
}
.map-pin-label::before{display:none}
.map-fallback{padding:14px;text-align:center}
.map-fallback h4{color:var(--ink);margin-bottom:4px}
.map-list li{gap:8px}
.map-list .grow{flex:1 1 160px;min-width:0}
.map-list .btn{min-height:42px;font-size:14px;padding:6px 10px}

/* ---------- 요약 수치 ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .k{font-size:13.5px;color:var(--ink-3);font-weight:700}
.kpi .v{font-size:19px;font-weight:900;color:var(--ink);line-height:1.3}
.kpi.warn{border-color:#d8a05a;background:var(--warn-soft)}
.kpi.danger{border-color:#d89399;background:var(--danger-soft)}
.kpi .v small{font-size:13px;font-weight:700;color:var(--ink-3)}

/* ---------- 표 ---------- */
.tablewrap{overflow-x:auto;margin-top:8px;border-radius:10px;border:1px solid var(--line-2)}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
th{background:#f7f9fb;font-weight:800;white-space:nowrap}

/* ---------- 개인 메모 ---------- */
.personal{border:2px dashed #b9922f;background:#fffdf4;border-radius:12px;padding:12px;margin-top:10px}
.personal h4{color:#6b4b00;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.masked{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
textarea.memo{min-height:70px}

/* ---------- 토스트 ---------- */
.toast-area{
  position:fixed;left:0;right:0;bottom:78px;z-index:60;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 10px;
}
.toast{
  pointer-events:auto;background:#14181f;color:#fff;border-radius:12px;padding:10px 14px;
  font-size:15px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  max-width:min(560px,100%);box-shadow:0 6px 20px rgba(0,0,0,.28);
}
.toast button{min-height:40px;padding:6px 10px;font-size:15px;border-color:#5b636d;background:#2a313a;color:#fff}

/* ---------- 대화상자 ---------- */
dialog{
  border:none;border-radius:16px;padding:0;max-width:min(560px,calc(100% - 20px));width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}
dialog::backdrop{background:rgba(10,14,20,.55)}
.dlg-head{padding:14px 16px;border-bottom:1px solid var(--line-2);background:#f7f9fb;border-radius:16px 16px 0 0}
.dlg-body{padding:14px 16px;max-height:min(66vh,520px);overflow:auto}
.dlg-foot{padding:12px 16px;border-top:1px solid var(--line-2);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- 기타 ---------- */
.hr{height:1px;background:var(--line-2);margin:14px 0;border:0}
.pill{display:inline-block;background:var(--neutral-soft);border-radius:999px;padding:2px 9px;font-size:13.5px;font-weight:700;color:var(--ink-2);margin:2px 4px 2px 0}
.list-plain{list-style:none;padding:0;margin:0}
.list-plain li{padding:8px 0;border-bottom:1px solid var(--line-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list-plain li:last-child{border-bottom:0}
.callout{border-left:5px solid var(--accent);padding:2px 0 2px 10px;margin:10px 0;color:var(--ink-2)}
.tiny{font-size:13px;color:var(--ink-3)}
.nowrap{white-space:nowrap}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* PC */
@media (min-width:760px){
  h1{font-size:26px}
  .topbar h1{font-size:22px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .maplinks{grid-template-columns:repeat(3,minmax(0,1fr))}
  .trip-map{height:360px}
  .maplinks .full{grid-column:auto}
  body{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
@media print{
  .tabbar,.topbar .savechip,.toast-area{display:none}
  body{background:#fff;padding:0}
}
</style>
</head>

<nav class="tabbar" id="tabbar" aria-label="주요 화면">

</dialog>

    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var cur = it.currency === 'JPY' ? 'jpy' : 'krw';
      var status = it.status;
      if (status === 'unknown' || it.amount === null || it.amount === undefined) {
        out.unknownCount++;
        out.unknownLabels.push(it.label);
        if (status === 'paid' || status === 'reserved' || status === 'estimate' || status === 'refund') {
          out.counts[status] = (out.counts[status] || 0) + 1;
        }
        continue;
      }
      var amt = Number(it.amount);
      if (!isFinite(amt)) { out.unknownCount++; out.unknownLabels.push(it.label); continue; }
      if (status === 'paid' || status === 'reserved' || status === 'estimate' || status === 'refund') {
        out[cur][status] += amt;
        out.counts[status] = (out.counts[status] || 0) + 1;
        if (status === 'refund') {
          if (it.refundConfirmed) out[cur].refundConfirmed += amt;
        } else {
          var key = it.category || '기타';
          if (!out.byCategory[key]) out.byCategory[key] = { krw: 0, jpy: 0 };
          out.byCategory[key][cur] += amt;
        }
      }
    }

    out.krw.net = out.krw.paid + out.krw.reserved + out.krw.estimate - out.krw.refundConfirmed;
    out.jpy.net = out.jpy.paid + out.jpy.reserved + out.jpy.estimate - out.jpy.refundConfirmed;

    var rate = budget && budget.jpyRate ? Number(budget.jpyRate) : null;
    if (rate && rate > 0) {
      out.totalKrw = Math.round(out.krw.net + out.jpy.net * rate);
    } else {
      out.needsRate = out.jpy.net !== 0;
    }
    if (out.targetKrw) {
      out.limitKrw = Math.round(out.targetKrw * (1 + (Number(out.bufferPct) || 0) / 100));
      if (out.totalKrw !== null) {
        out.remainingKrw = out.limitKrw - out.totalKrw;
        out.overLimit = out.remainingKrw < 0;
      }
    }
    return out;
  };

  /* 예상 → 실제 전환: 같은 항목을 고쳐 쓰므로 중복 합산이 생기지 않습니다. */
  C.estimateToActual = function (budget, itemId, actualAmount) {
    var items = budget.items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].id !== itemId) continue;
      var it = items[i];
      it.convertedFrom = {
        status: it.status,
        amount: it.amount,
        currency: it.currency,
        at: new Date().toISOString()
      };
      it.status = 'paid';
      if (actualAmount !== undefined && actualAmount !== null && actualAmount !== '') {
        it.amount = Number(actualAmount);
      }
      it.label = it.label.replace(/\s*\(예상\)$/, '');
      return it;
    }
    return null;
  };

  /* ---------- 일정 편집 ---------- */
  C.moveItemWithinDay = function (day, index, dir) {
    var target = index + (dir === 'up' ? -1 : 1);
    if (target < 0 || target >= day.items.length) return false;
    var tmp = day.items[index];
    day.items[index] = day.items[target];
    day.items[target] = tmp;
    C.reindex(day);
    C.markTravelStale(day, target);
    C.markTravelStale(day, index);
    return true;
  };

  C.reindex = function (day) {
    for (var i = 0; i < day.items.length; i++) { day.items[i].order = i; }
  };

  C.markTravelStale = function (day, index) {
    if (!day || !day.items) return;
    for (var k = Math.max(0, index); k <= Math.min(index + 1, day.items.length - 1); k++) {
      var it = day.items[k];
      if (it && it.travel && k > 0) it.travel.stale = true;
    }
  };

  C.markAllTravelStale = function (day) {
    if (!day || !day.items) return;
    for (var i = 1; i < day.items.length; i++) { if (day.items[i].travel) day.items[i].travel.stale = true; }
  };

  /* 여행 전/중/후 뷰는 표시만 바꿉니다. 방문 완료·현재 목적지는 자동 지정하지 않습니다. */
  C.viewModeLabel = function (mode) {
    return { before: '여행 전', during: '여행 중', after: '여행 후' }[mode] || '여행 전';
  };

  C.setItemStatus = function (state, itemId, status) {
    var it = C.findItem(state, itemId);
    if (!it) return null;
    if (['planned', 'done', 'skipped'].indexOf(status) < 0) return null;
    it.status = status;
    it.statusAt = new Date().toISOString();
    return it;
  };

  /* ---------- 경고 계산 ---------- */
  C.checkDay = function (day) {
    var out = [];
    var items = (day && day.items) || [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var s = C.toMin(it.time), e = C.toMin(it.endTime);
      if (it.time && s === null) {
        out.push({ level: 'danger', itemId: it.id, text: '시각 형식이 잘못되었습니다: ' + it.time });
      }
      if (s !== null && e !== null && e < s && (s - e) < 12 * 60) {
        out.push({ level: 'danger', itemId: it.id, text: '종료 시각이 시작 시각보다 빠릅니다: ' + it.name });
      }
      /* 운영시간 */
      var op = it.opening;
      if (op && s !== null) {
        var open = C.toMin(op.open), close = C.toMin(op.close);
        if (open !== null && s < open) {
          out.push({ level: 'warn', itemId: it.id, text: '운영 시작(' + op.open + ') 전 도착입니다: ' + it.name });
        }
        if (close !== null && e !== null && e > close) {
          out.push({ level: 'warn', itemId: it.id, text: '운영 종료(' + op.close + ') 후까지 걸립니다: ' + it.name });
        }
        if (op.lastEntry && s !== null) {
          var le = C.toMin(op.lastEntry);
          if (le !== null && s > le) {
            out.push({ level: 'danger', itemId: it.id, text: '마지막 입장(' + op.lastEntry + ')을 넘겼습니다: ' + it.name });
          }
        }
      }
      /* 시간 겹침 */
      if (i > 0) {
        var prev = items[i - 1];
        var pe = C.toMin(prev.endTime);
        if (pe !== null && s !== null && s < pe) {
          out.push({
            level: 'danger', itemId: it.id,
            text: '앞 일정(' + prev.name + ' ' + prev.endTime + ')과 ' + (pe - s) + '분 겹칩니다.'
          });
        }
        var travel = it.travel;
        if (travel && typeof travel.min === 'number' && pe !== null && s !== null) {
          if (s - pe < travel.min) {
            out.push({
              level: 'warn', itemId: it.id,
              text: '앞 일정 종료부터 ' + (s - pe) + '분뿐인데 이동에 ' +
                travel.min + '분(' + travel.source + ')이 걸립니다.'
            });
          }
        }
      }
      /* 예약·마감 */
      if (it.deadline && it.deadline.time) {
        var dl = C.toMin(it.deadline.time);
        if (dl !== null && s !== null && s > dl) {
          out.push({ level: 'danger', itemId: it.id, text: '이 항목이 마감(' + it.deadline.time + ') 이후에 시작합니다: ' + it.deadline.label });
        }
        if (i > 0) {
          var pe2 = C.toMin(items[i - 1].endTime);
          if (dl !== null && pe2 !== null && pe2 > dl) {
            out.push({ level: 'danger', itemId: it.id, text: '앞 일정이 마감(' + it.deadline.time + ')을 넘깁니다: ' + it.deadline.label });
          }
        }
      }
    }
    return out;
  };

  C.checkReservations = function (state) {
    var out = [];
    var list = (state && state.reservations) || [];
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      if (r.status === 'cancelled') continue;
      if (r.linkedItemId) {
        var day = C.dayOfItem(state, r.linkedItemId);
        if (!day) {
          out.push({ level: 'danger', reservationId: r.id, text: '연결된 일정 항목을 찾을 수 없습니다: ' + r.title });
        } else if (r.date && day.date !== r.date) {
          out.push({
            level: 'danger', reservationId: r.id,
            text: '예약 날짜(' + r.date + ')와 일정 날짜(' + day.date + ')가 다릅니다: ' + r.title
          });
        }
      }
      if (r.status === 'needs_action') {
        out.push({ level: 'warn', reservationId: r.id, text: '아직 처리되지 않은 예약입니다: ' + r.title });
      }
      if (r.notify && r.notify !== '설정됨') {
        out.push({ level: 'info', reservationId: r.id, text: '알림: ' + r.notify + ' — ' + r.title });
      }
    }
    return out;
  };

  /* 항목 하나에 대한 표시용 경고 모음 */
  C.itemWarnings = function (state, day, index) {
    var all = C.checkDay(day);
    return all.filter(function (w) { return w.itemId === day.items[index].id; });
  };

  /* ---------- 지도·길찾기 링크 ---------- */
  C.placeQuery = function (name, address) {
    var q = [name || '', address || ''].filter(Boolean).join(' ');
    return q.replace(/\s+/g, ' ').trim();
  };

  C.buildMapLinks = function (name, address) {
    var q = C.placeQuery(name, address);
    var e = encodeURIComponent(q);
    return {
      google: { label: 'Google 지도', href: 'https://www.google.com/maps/search/?api=1&query=' + e, kind: 'map' },
      apple: { label: 'Apple 지도', href: 'https://maps.apple.com/?q=' + e, kind: 'map' },
      naver: { label: '네이버 지도', href: 'https://map.naver.com/p/search/' + e, kind: 'map' },
      kakao: { label: '카카오맵', href: 'https://map.kakao.com/?q=' + e, kind: 'map' },
      tmap: { label: '티맵 (운전)', href: 'tmap://search?keyword=' + e, kind: 'drive' },
      kakaonavi: { label: '카카오내비 (운전)', href: 'kakaonavi://search?keyword=' + e, kind: 'drive' }
    };
  };

  C.driveSearchText = function (name, address) {
    return C.placeQuery(name, address) + ' 주차';
  };

  /* ---------- ICS ---------- */
  C.icsEscape = function (s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  };

  C.utf8Len = function (codePoint) {
    if (codePoint < 0x80) return 1;
    if (codePoint < 0x800) return 2;
    if (codePoint < 0x10000) return 3;
    return 4;
  };

  /* RFC 5545: 줄은 75옥텟(UTF-8 바이트)을 넘지 않게 접고, 이어지는 줄은 공백으로 시작합니다. */
  C.icsFold = function (line) {
    var out = [], cur = '', bytes = 0, limit = 75;
    for (var i = 0; i < line.length;) {
      var cp = line.codePointAt ? line.codePointAt(i) : line.charCodeAt(i);
      var b = C.utf8Len(cp);
      if (bytes + b > limit) {
        out.push(cur);
        cur = ' ';
        bytes = 1;
      }
      if (cp > 0xFFFF) { cur += line.substr(i, 2); i += 2; }
      else { cur += line.charAt(i); i += 1; }
      bytes += b;
    }
    out.push(cur);
    return out.join('\r\n');
  };

  C.icsStamp = function (dateStr, timeStr) {
    /* 입력은 현지(UTC+9) 시각, 출력은 UTC */
    var p = dateStr.split('-');
    var y = parseInt(p[0], 10), mo = parseInt(p[1], 10), d = parseInt(p[2], 10);
    var t = C.toMin(timeStr || '00:00');
    if (t === null) t = 0;
    var dt = new Date(Date.UTC(y, mo - 1, d, 0, 0, 0));
    dt.setUTCMinutes(dt.getUTCMinutes() + (t - 9 * 60));
    return dt.getUTCFullYear() + C.pad(dt.getUTCMonth() + 1) + C.pad(dt.getUTCDate()) +
      'T' + C.pad(dt.getUTCHours()) + C.pad(dt.getUTCMinutes()) + '00Z';
  };

  C.buildICS = function (state, nowUtc) {
    var stamp = nowUtc || '20261115T000000Z';
    var lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//osaka-trip-app//KO//KR',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'X-WR-CALNAME:오사카 가족 여행 2026'
    ];
    var events = [];
    var list = (state.reservations || []).filter(function (r) {
      return r.status !== 'cancelled' && r.date && r.time;
    });
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      events.push({
        uid: r.id + '@osaka-trip-app',
        start: C.icsStamp(r.date, r.time),
        end: C.icsStamp(r.date, r.endTime || r.time),
        summary: r.title,
        location: r.route || '',
        description: (r.details || '') + ' · 알림: ' + (r.notify || '미설정')
      });
    }
    for (var k = 0; k < events.length; k++) {
      var ev = events[k];
      lines.push('BEGIN:VEVENT');
      lines.push('UID:' + ev.uid);
      lines.push('DTSTAMP:' + stamp);
      lines.push('DTSTART:' + ev.start);
      lines.push('DTEND:' + ev.end);
      lines.push(C.icsFold('SUMMARY:' + C.icsEscape(ev.summary)));
      if (ev.location) lines.push(C.icsFold('LOCATION:' + C.icsEscape(ev.location)));
      if (ev.description) lines.push(C.icsFold('DESCRIPTION:' + C.icsEscape(ev.description)));
      lines.push('END:VEVENT');
    }
    lines.push('END:VCALENDAR');
    return lines.join('\r\n') + '\r\n';
  };

  /* ---------- 백업·복구 ---------- */
  C.exportPayload = function (state, personal, includePersonal, nowIso) {
    var payload = {
      app: 'osaka-trip-app',
      schemaVersion: C.SCHEMA_VERSION,
      appVersion: (state && state.appVersion) || '1.2.1',
      exportedAt: nowIso || new Date().toISOString(),
      includePersonal: !!includePersonal,
      data: {
        trip: state.trip,
        party: state.party,
        days: state.days,
        candidates: state.candidates,
        reservations: state.reservations,
        budget: state.budget,
        checklist: state.checklist,
        confirmations: state.confirmations,
        alternatives: state.alternatives,
        notices: state.notices,
        settings: state.settings
      }
    };
    if (includePersonal && personal) { payload.personal = personal; }
    return payload;
  };

  C.validateBackup = function (obj) {
    var errors = [], warnings = [];
    if (obj === null || typeof obj !== 'object') {
      return { ok: false, errors: ['JSON 최상위가 객체가 아닙니다.'], warnings: [], summary: null };
    }
    if (!obj.schemaVersion) errors.push('schemaVersion 이 없습니다.');
    else if (Number(obj.schemaVersion) > C.SCHEMA_VERSION) {
      errors.push('이 앱보다 새로운 형식(schemaVersion ' + obj.schemaVersion + ')입니다.');
    }
    var d = obj.data || obj.state;
    if (!d || typeof d !== 'object') {
      errors.push('data(여행 자료)가 없습니다.');
      return { ok: false, errors: errors, warnings: warnings, summary: null };
    }
    if (!Array.isArray(d.days) || d.days.length === 0) errors.push('days(일자)가 없습니다.');
    if (!d.trip || !d.trip.start || !d.trip.end) errors.push('trip.start/end 가 없습니다.');

    var itemCount = 0, dayCount = 0;
    if (Array.isArray(d.days)) {
      dayCount = d.days.length;
      for (var i = 0; i < d.days.length; i++) {
        var day = d.days[i];
        if (!day || typeof day !== 'object') { errors.push('days[' + i + '] 가 객체가 아닙니다.'); continue; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(day.date || ''))) errors.push('days[' + i + '].date 형식이 잘못되었습니다.');
        if (!Array.isArray(day.items)) { errors.push('days[' + i + '].items 가 배열이 아닙니다.'); continue; }
        itemCount += day.items.length;
        for (var j = 0; j < day.items.length; j++) {
          var it = day.items[j];
          if (!it || typeof it !== 'object') { errors.push('days[' + i + '].items[' + j + '] 가 객체가 아닙니다.'); continue; }
          if (!it.id) errors.push('days[' + i + '].items[' + j + '].id 가 없습니다.');
          if (!it.name) errors.push('days[' + i + '].items[' + j + '].name 이 없습니다.');
          if (it.time && C.toMin(it.time) === null) errors.push('days[' + i + '].items[' + j + '].time 형식 오류: ' + it.time);
        }
      }
    }
    if (d.budget && Array.isArray(d.budget.items)) {
      for (var b = 0; b < d.budget.items.length; b++) {
        var bi = d.budget.items[b];
        if (!bi || !bi.id) { errors.push('budget.items[' + b + '].id 가 없습니다.'); continue; }
        if (['paid', 'reserved', 'estimate', 'refund', 'unknown'].indexOf(bi.status) < 0) {
          errors.push('budget.items[' + b + '].status 값이 잘못되었습니다: ' + bi.status);
        }
        if (bi.amount !== null && bi.amount !== undefined && typeof bi.amount !== 'number') {
          errors.push('budget.items[' + b + '].amount 가 숫자도 null 도 아닙니다.');
        }
        if (bi.currency && ['KRW', 'JPY'].indexOf(bi.currency) < 0) {
          errors.push('budget.items[' + b + '].currency 값이 잘못되었습니다: ' + bi.currency);
        }
      }
    }
    if (!Array.isArray(d.candidates)) warnings.push('후보(candidates)가 없어 빈 목록으로 복원됩니다.');
    if (!Array.isArray(d.reservations)) warnings.push('예약(reservations)이 없어 빈 목록으로 복원됩니다.');

    var summary = {
      tripStart: d.trip && d.trip.start,
      tripEnd: d.trip && d.trip.end,
      days: dayCount,
      items: itemCount,
      candidates: Array.isArray(d.candidates) ? d.candidates.length : 0,
      reservations: Array.isArray(d.reservations) ? d.reservations.length : 0,
      budgetItems: d.budget && Array.isArray(d.budget.items) ? d.budget.items.length : 0,
      checklist: Array.isArray(d.checklist) ? d.checklist.length : 0,
      confirmations: Array.isArray(d.confirmations) ? d.confirmations.length : 0,
      hasPersonal: !!obj.personal,
      exportedAt: obj.exportedAt || null
    };
    return { ok: errors.length === 0, errors: errors, warnings: warnings, summary: summary };
  };

  C.parseBackupText = function (text) {
    var obj;
    try { obj = JSON.parse(text); }
    catch (e) { return { ok: false, errors: ['JSON 을 읽을 수 없습니다: ' + e.message], warnings: [], summary: null }; }
    return C.validateBackup(obj);
  };

  /* 합치기: id 기준. 같은 id 는 현재 것을 유지하고, 새 id 만 더합니다. */
  C.mergeStates = function (current, incoming) {
    var out = C.clone(current);
    var report = { addedItems: 0, skippedItems: 0, addedCandidates: 0, skippedCandidates: 0, addedChecklist: 0, addedConfirmations: 0, addedBudget: 0, addedReservations: 0, addedDays: 0, daysKept: [] };
    var inc = C.clone(incoming);

    if (Array.isArray(inc.days)) {
      for (var i = 0; i < inc.days.length; i++) {
        var incDay = inc.days[i];
        var curDay = null;
        for (var k = 0; k < out.days.length; k++) { if (out.days[k].date === incDay.date) { curDay = out.days[k]; break; } }
        if (!curDay) {
          out.days.push(incDay);
          report.addedDays++;
          report.addedItems += (incDay.items || []).length;
          continue;
        }
        report.daysKept.push(incDay.date);
        var existing = {};
        for (var j = 0; j < curDay.items.length; j++) { existing[curDay.items[j].id] = true; }
        for (var m = 0; m < (incDay.items || []).length; m++) {
          var it = incDay.items[m];
          if (existing[it.id]) { report.skippedItems++; continue; }
          curDay.items.push(it);
          report.addedItems++;
        }
        C.reindex(curDay);
      }
    }

    function mergeList(key, label) {
      if (!Array.isArray(inc[key])) return;
      var seen = {};
      for (var i = 0; i < out[key].length; i++) { seen[out[key][i].id] = true; }
      for (var j = 0; j < inc[key].length; j++) {
        if (seen[inc[key][j].id]) continue;
        out[key].push(inc[key][j]);
        report[label] = (report[label] || 0) + 1;
      }
    }
    mergeList('candidates', 'addedCandidates');
    mergeList('checklist', 'addedChecklist');
    mergeList('confirmations', 'addedConfirmations');
    mergeList('reservations', 'addedReservations');

    if (inc.budget && Array.isArray(inc.budget.items)) {
      var seenB = {};
      for (var b = 0; b < out.budget.items.length; b++) { seenB[out.budget.items[b].id] = true; }
      for (var c = 0; c < inc.budget.items.length; c++) {
        if (seenB[inc.budget.items[c].id]) continue;
        out.budget.items.push(inc.budget.items[c]);
        report.addedBudget++;
      }
    }
    return { state: out, report: report };
  };

  C.applyReplace = function (current, incoming) {
    var next = C.clone(current);
    var d = C.clone(incoming);
    next.trip = d.trip || next.trip;
    next.party = d.party || next.party;
    next.days = d.days || next.days;
    next.candidates = d.candidates || [];
    next.reservations = d.reservations || [];
    next.budget = d.budget || next.budget;
    next.checklist = d.checklist || [];
    next.confirmations = d.confirmations || [];
    next.alternatives = d.alternatives || next.alternatives;
    next.notices = d.notices || next.notices;
    for (var i = 0; i < next.days.length; i++) { C.reindex(next.days[i]); }
    return next;
  };

  /* ---------- 휴지통 ---------- */
  C.trashPush = function (state, entry) {
    if (!state.trash) state.trash = [];
    var e = C.clone(entry);
    e.id = e.id || C.uid('tr');
    e.at = e.at || new Date().toISOString();
    state.trash.unshift(e);
    if (state.trash.length > 50) state.trash.length = 50;
    return e;
  };

  C.removeItem = function (state, itemId, guard) {
    if (guard && guard('remove:' + itemId) === false) return null;
    for (var i = 0; i < state.days.length; i++) {
      var day = state.days[i];
      for (var j = 0; j < day.items.length; j++) {
        if (day.items[j].id !== itemId) continue;
        var item = day.items[j];
        day.items.splice(j, 1);
        C.reindex(day);
        C.markTravelStale(day, Math.max(0, j - 1));
        var entry = C.trashPush(state, { kind: 'item', dayId: day.date, index: j, payload: item, label: item.name });
        return { entry: entry, day: day };
      }
    }
    return null;
  };

  C.restoreTrash = function (state, trashId) {
    if (!state.trash) return null;
    for (var i = 0; i < state.trash.length; i++) {
      var e = state.trash[i];
      if (e.id !== trashId) continue;
      if (e.kind === 'item') {
        var day = C.findDay(state, e.dayId);
        if (!day) return { ok: false, reason: '해당 날짜가 없습니다.' };
        for (var j = 0; j < day.items.length; j++) {
          if (day.items[j].id === e.payload.id) return { ok: false, reason: '이미 같은 항목이 있습니다.' };
        }
        var idx = Math.max(0, Math.min(e.index, day.items.length));
        day.items.splice(idx, 0, e.payload);
        C.reindex(day);
        C.markAllTravelStale(day);
      }
      state.trash.splice(i, 1);
      return { ok: true, restored: e };
    }
    return null;
  };

  C.emptyTrash = function (state, allow) {
    if (!allow) return { ok: false, reason: '백업 확인이 필요합니다.' };
    var n = (state.trash || []).length;
    state.trash = [];
    return { ok: true, removed: n };
  };

  /* 연속 클릭 중복 방지 (같은 키는 ms 동안 1회만 통과) */
  C.makeGuard = function (nowFn) {
    var seen = {};
    var now = nowFn || function () { return Date.now(); };
    return function (key, ms) {
      var t = now();
      var span = ms || 700;
      if (seen[key] && t - seen[key] < span) return false;
      seen[key] = t;
      return true;
    };
  };

  /* ---------- 개인 메모 ---------- */
  C.maskText = function (s) {
    if (!s) return '';
    var str = String(s);
    if (str.length <= 2) return '••';
    return '•'.repeat(Math.min(12, str.length));
  };

  C.personalSummary = function (personal) {
    if (!personal) return { itemCount: 0, hasGeneral: false };
    var n = 0;
    var items = personal.items || {};
    for (var k in items) { if (Object.prototype.hasOwnProperty.call(items, k)) { if ((items[k].memo || items[k].ref || '').trim()) n++; } }
    return { itemCount: n, hasGeneral: !!(personal.general && personal.general.trim()) };
  };

  /* ---------- 요약 ---------- */
  C.summarize = function (state) {
    var items = 0, done = 0, skipped = 0, optional = 0, needs = 0;
    for (var i = 0; i < state.days.length; i++) {
      for (var j = 0; j < state.days[i].items.length; j++) {
        var it = state.days[i].items[j];
        items++;
        if (it.status === 'done') done++;
        if (it.status === 'skipped') skipped++;
        if (it.badge === 'optional') optional++;
        if (it.badge === 'needs_check') needs++;
      }
    }
    var budget = C.budgetTotals(state.budget);
    return {
      days: state.days.length,
      items: items,
      done: done,
      skipped: skipped,
      optional: optional,
      needsCheck: needs,
      checklistLeft: C.checklistLeft(state).length,
      confirmationsLeft: C.pendingConfirmations(state).length,
      candidates: state.candidates.length,
      budget: budget
    };
  };

  /* 검증용: 상태 전체에서 개인정보로 볼 수 있는 패턴 찾기 */
  C.scanPersonalData = function (state) {
    var text = JSON.stringify(state);
    var findings = [];
    if (/-?\b\d{6}-\d{7}\b/.test(text)) findings.push('주민등록번호 형식');
    if (/\b[A-Z0-9]{6}\b/.test(text.replace(/"id":"[^"]*"/g, ''))) findings.push('PNR/예약번호로 보이는 6자리 코드');
    if (/010-?\d{4}-?\d{4}/.test(text)) findings.push('휴대폰 번호');
    if (/\b\d{4}-\d{4}-\d{4}-\d{4}\b/.test(text)) findings.push('카드 번호 형식');
    return findings;
  };

  g.TripCore = C;

<script>
/* =========================================================

(function () {
  'use strict';

  var C = window.TripCore;
  var DATA = JSON.parse(document.getElementById('trip-data').textContent);

  var S = null;                 /* 여행 자료 상태 */
  var P = C.emptyPersonal();    /* 기기 전용 개인 메모 */

  function safeGet(key) {

  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); return true; }

    var raw = safeGet(C.STORAGE_KEY);

      if (o && typeof o === 'object') return o;

    } catch (e) { return null; }
  }

  function setSave(status, detail) {
    var chip = document.getElementById('save-chip');
    if (!chip) return;
    var time = '';
    if (S && S.savedAt) {
      var d = new Date(S.savedAt);
      time = C.pad(d.getHours()) + ':' + C.pad(d.getMinutes()) + ':' + C.pad(d.getSeconds());

    if (status === 'saving') chip.innerHTML = '<span class="dot"></span>저장 중…';

    else chip.innerHTML = '<span class="dot"></span>저장 실패 · 기기 저장 공간 확인' + (detail ? ' (' + C.esc(detail) + ')' : '');
  }

  function writeNow(after) {
    setSave('saving');
    S.savedAt = new Date().toISOString();
    var raw = JSON.stringify(S);
    var ok = safeSet(C.STORAGE_KEY, raw);
    if (ok) {
      baseRev = S.revision;
      lastSaveError = '';
      window.setTimeout(function () { setSave('saved'); }, 30);
    } else {
      lastSaveError = '용량 초과 또는 저장이 막힌 브라우저';
      setSave('failed', lastSaveError);
    }
    if (typeof after === 'function') after(ok);
    return ok;
  }

  /* 모든 편집은 이 함수를 지나갑니다. 다른 탭이 먼저 저장했다면 덮어쓰지 않습니다. */
  function commit(mutator, opts) {
    opts = opts || {};
    if (conflict) { renderConflict(); toast('다른 탭의 변경과 충돌이 있습니다. 먼저 아래 배너에서 처리하세요.'); return false; }

    if (stored && C.shouldBlockSave(baseRev, stored.revision)) {
      conflict = stored;
      renderConflict();
      toast('다른 탭이 먼저 저장했습니다. 덮어쓰지 않았습니다.');
      return false;
    }
    mutator(S);
    S.revision = baseRev + 1;
    writeNow();
    if (!opts.noRender) render();
    return true;
  }

  function loadAll() {
    var raw = safeGet(C.STORAGE_KEY);
    if (raw) {
      try {
        var parsed = JSON.parse(raw);

      } catch (e) { S = null; }
      /* 자료(확정 내용)가 갱신되면 기기에 저장된 예전 상태 대신 새 자료로 시작합니다.
         바꾸기 직전 상태는 자동 복구본에 남겨 ‘저장·백업·복구’ 화면에서 되돌릴 수 있습니다. */
      if (S && DATA.meta.contentVersion && S.contentVersion !== DATA.meta.contentVersion) {

        writeNow();
      }
    }
    if (!S) {
      S = C.buildInitialState(DATA);
      S.revision = 1;
      writeNow();
    }
    if (!S.settings) S.settings = { tab: 'home', viewMode: 'before', activeDate: S.days[0].date, editMode: false, hidePersonal: true };

  var MAP_PLACES = [

  var tripMap = null;

  function mapCard() {
    var h = '<div class="card">' +

  function ensureLeaflet(cb) {
    if (window.L && window.L.map) { cb(null); return; }
    if (leafletLoader.failed) { cb(new Error('leaflet-unavailable')); return; }
    leafletLoader.queue.push(cb);
    if (leafletLoader.loading) return;
    leafletLoader.loading = true;
    if (!document.getElementById('leaflet-css')) {
      var link = document.createElement('link');
      link.id = 'leaflet-css';
      link.rel = 'stylesheet';
      link.href = LEAFLET_URLS.css;
      link.crossOrigin = 'anonymous';
      document.head.appendChild(link);
    }
    loadScript(0);

    function loadScript(i) {
      if (i >= LEAFLET_URLS.js.length) { finish(new Error('leaflet-load')); return; }
      var s = document.createElement('script');
      s.src = LEAFLET_URLS.js[i];
      s.async = true;
      s.crossOrigin = 'anonymous';
      s.onload = function () {
        if (window.L && window.L.map) finish(null); else loadScript(i + 1);
      };
      s.onerror = function () { loadScript(i + 1); };
      document.head.appendChild(s);
    }

    function finish(err) {
      leafletLoader.loading = false;
      if (err) leafletLoader.failed = true;
      var q = leafletLoader.queue;
      leafletLoader.queue = [];
      for (var i = 0; i < q.length; i++) { try { q[i](err); } catch (e) { } }
    }
  }

  function mapFallback(host) {
    host.innerHTML = '<div class="map-fallback"><h4>지도를 불러오지 못했습니다</h4>' +
      '<p class="small muted">인터넷 연결을 확인한 뒤 다시 시도하거나, 아래 목록의 Google 지도 링크를 이용하세요.</p>' +
      '<button type="button" class="btn btn-sm" id="map-retry">다시 시도</button></div>';
    var b = document.getElementById('map-retry');
    if (b) {
      b.addEventListener('click', function () {
        leafletLoader.failed = false;
        host.innerHTML = '';
        initTripMap();
      });
    }
  }

  function initTripMap() {
    var el = document.getElementById('trip-map');
    if (!el) {
      if (tripMap) { try { tripMap.remove(); } catch (e) { } tripMap = null; }
      return;
    }
    ensureLeaflet(function (err) {
      var host = document.getElementById('trip-map');
      if (!host) return; /* 그사이 다른 화면으로 바뀌었으면 아무것도 하지 않습니다. */
      if (err || !window.L) { mapFallback(host); return; }
      var L = window.L;
      if (tripMap) { try { tripMap.remove(); } catch (e) { } tripMap = null; }
      host.innerHTML = '';
      var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
      var map = L.map(host, {
        scrollWheelZoom: false,
        dragging: !coarse,
        tap: true,
        zoomControl: true,
        minZoom: 5,
        maxZoom: 18
      });
      tripMap = map;
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 기여자'
      }).addTo(map);

      var bounds = L.latLngBounds([]);
      var markers = {};
      MAP_PLACES.forEach(function (p) {
        var icon = L.divIcon({
          className: '',
          html: '<div class="map-pin ' + p.id + '">' + p.emoji + '</div>',
          iconSize: [38, 38],
          iconAnchor: [19, 19],
          popupAnchor: [0, -22]
        });
        var marker = L.marker([p.lat, p.lng], { icon: icon, title: p.name, alt: p.name, keyboard: true }).addTo(map);
        marker.bindTooltip(p.short, { permanent: true, direction: 'top', offset: [0, -20], className: 'map-pin-label' });
        marker.bindPopup('<div><b>' + p.emoji + ' ' + esc(p.name) + '</b>' +
          '<div class="small muted" style="margin:4px 0 8px">' + esc(p.role) + '</div>' +
          '<a class="btn btn-sm" href="' + p.gmap + '" target="_blank" rel="noopener">Google 지도에서 열기</a></div>',
          { maxWidth: 240 });
        markers[p.id] = marker;
        bounds.extend([p.lat, p.lng]);
      });

      /* 초기에 세 핀이 모두 보이도록 맞춥니다. */
      map.fitBounds(bounds, { padding: [38, 38] });
      /* 핀은 지도에 그려진 다음에야 요소가 생깁니다. 그 뒤에 읽어주는 이름을 붙입니다. */
      MAP_PLACES.forEach(function (p) {
        var el = markers[p.id] && markers[p.id].getElement();
        if (el) el.setAttribute('aria-label', p.name + ' · ' + p.role);
      });
      window.requestAnimationFrame(function () {
        if (tripMap !== map) return;
        map.invalidateSize();
        map.fitBounds(bounds, { padding: [38, 38] });
      });

      Array.prototype.forEach.call(document.querySelectorAll('[data-map-focus]'), function (b) {
        b.addEventListener('click', function () {
          var p = mapPlace(b.getAttribute('data-map-focus'));
          var marker = p && markers[p.id];
          if (!marker) return;
          marker.openPopup();
          map.flyTo([p.lat, p.lng], 14, { duration: 0.6 });
        });
      });
    });
  }

      '<li>' + badge('confirmed') + ' 예약·결제가 끝난 확정 사항</li>' +
      '<li>' + badge('planned') + ' 계획한 일정(바뀔 수 있음)</li>' +
      '<li>' + badge('optional') + ' 선택 후보(체력·날씨에 따라 생략)</li>' +
      '<li>' + badge('needs_check') + ' 아직 확인·예약이 필요한 사항</li>' +
      '<li>' + badge('cancelled') + ' 취소·제외된 일정</li>' +
      '</ul>' +
      '<p class="small"><b>출처</b>: ‘확정 예약’은 예약된 사실, ‘사용자 계획’은 요청하신 계획, ‘조사 참고’는 제가 찾은 자료, ‘공식 자료’는 시설·행사 공식 안내입니다. 항목별 확인일은 배지에 표시했고(2026-11-24에 갱신한 항목은 그 날짜), 예약·일정이 바뀌면 함께 갱신합니다.</p></div></details>';

    h += '<div class="tabs" role="tablist">' + days().map(function (d) {
      return '<button type="button" class="tab" role="tab" aria-selected="' + (d.date === day.date) + '" data-act="set-date" data-date="' + d.date + '">' +
        esc(C.dateLabel(d.date, d.weekday)) + '</button>';
    }).join('') + '</div>';

    h += '<div class="card"><div class="card-head"><div><h3>' + esc(C.dateLabel(day.date, day.weekday)) + ' · ' + esc(day.title) + '</h3>' +
      '<p class="small muted">' + esc(day.note || '') + '</p></div></div>' +
      '<div class="badge-row"><span class="badge plain">항목 ' + items.length + '개</span>' +
      '<span class="badge plain">선택 ' + optionalCount + '개</span>' +
      '<span class="badge plain">방문 완료 ' + items.filter(function (i) { return i.status === 'done'; }).length + '개</span></div>';

    if (warns.length) {
      h += '<details open><summary>이 날의 경고 ' + warns.length + '건</summary><div class="body">' +
        warns.map(function (w) {
          return '<div class="notice ' + (w.level === 'danger' ? 'danger' : 'warn') + '">' + esc(w.text) + '</div>';
        }).join('') + '</div></details>';
    }
    h += '</div>';

    if (S.settings.viewMode === 'after') {
      var doneN = items.filter(function (i) { return i.status === 'done'; }).length;
      var skipN = items.filter(function (i) { return i.status === 'skipped'; }).length;
      h += '<div class="banner info"><h4>여행 후 보기</h4><p class="small">방문 완료 ' + doneN + '개 · 건너뜀 ' + skipN + '개 · 미표시 ' + (items.length - doneN - skipN) + '개. 아래에 전체 일정이 그대로 표시됩니다.</p></div>';
    }
    if (S.settings.viewMode === 'during') {
      h += '<div class="card"><h3>여행 중 빠른 보기</h3>' +
        '<p class="small muted">현재 위치나 시각으로 ‘다음 목적지’를 자동 지정하지 않습니다. 아래에서 직접 고르세요.</p>' +
        '<ul class="list-plain">' + items.map(function (i) {
          return '<li><b class="nowrap">' + esc(i.time || '--:--') + '</b><span style="flex:1 1 140px;min-width:0">' + esc(i.name) + '</span>' +
            (i.status === 'done' ? '<span class="badge sm confirmed">완료</span>' : i.status === 'skipped' ? '<span class="badge sm plain">건너뜀</span>' : '') + '</li>';
        }).join('') + '</ul></div>';
    }

    h += '<ol class="items">' + items.map(function (it, i) { return itemCard(day, it, i); }).join('') + '</ol>';

    if (!items.length) h += '<div class="card"><p>이 날의 일정이 비었습니다. 편집 모드에서 항목을 추가하거나 후보를 이동하세요.</p></div>';

    if (S.settings.editMode) {
      h += '<div class="row"><button type="button" class="btn btn-primary" data-act="item-add">+ 이 날에 장소 추가</button>' +
        '<button type="button" class="btn" data-act="go" data-tab="candidates">후보에서 가져오기</button></div>';
    }

    h += '<div class="card"><h3>이동시간 다시 조회하기</h3><p class="small">순서를 바꾼 뒤에는 지도 앱에서 실제 이동 시간을 확인하고, 아래 버튼으로 값을 갱신하세요.</p>' +
      '<div class="row"><button type="button" class="btn btn-sm" data-act="travel-reset">이 날 이동시간 ‘확인 필요’로 표시</button>' +
      '<button type="button" class="btn btn-sm" data-act="go" data-tab="candidates">선택 후보 보기</button></div></div>';

    return h;
  }

  /* ---------------- 후보 ---------------- */
  function renderCandidates() {
    var h = '<div class="card"><h2>선택 후보</h2><p class="small muted">일정에 넣지 않은 후보입니다. 넣을 날짜를 골라야 실제 일정이 바뀝니다.</p></div>';
    h += S.candidates.map(function (c) {
      return '<div class="card"><div class="card-head"><div><h3>' + esc(c.name) + '</h3></div>' + badge(c.badge) + '</div>' +
        '<div class="item-meta">' +
        (c.address ? '<span class="line"><dt>주소</dt> ' + esc(c.address) + '</span>' : '') +
        (c.phone ? '<span class="line"><dt>연락처</dt> ' + esc(c.phone) + '</span>' : '') +
        (c.hours ? '<span class="line"><dt>시간</dt> ' + esc(c.hours) + '</span>' : '') +
        (c.booking ? '<span class="line"><dt>요금·예약</dt> ' + esc(c.booking) + '</span>' : '') +
        (c.stay ? '<span class="line"><dt>체류</dt> ' + esc(c.stay) + '</span>' : '') +
        '</div>' +
        '<p class="small" style="margin-top:8px">' + esc(c.note || '') + '</p>' +
        '<details><summary>자세히 · 지도</summary><div class="body"><p>' + esc(c.details || '') + '</p>' +
        (c.reason ? '<p class="hint">검토 의견: ' + esc(c.reason) + '</p>' : '') + mapsBlock(c) + accessBlock(c) +
        ((c.links && (c.links.official || c.links.ticket)) ? '<div class="row" style="margin-top:8px">' +
          (c.links.official ? '<a class="btn btn-sm" href="' + esc(c.links.official) + '" target="_blank" rel="noopener">공식 사이트</a>' : '') +
          (c.links.ticket ? '<a class="btn btn-sm" href="' + esc(c.links.ticket) + '" target="_blank" rel="noopener">예약·발권</a>' : '') +
          '</div>' : '') + '</div></details>' +
        '<div class="row" style="margin-top:10px">' +
        '<button type="button" class="btn btn-primary btn-sm" data-act="cand-to-day" data-id="' + esc(c.id) + '">일정에 넣기</button>' +
        '<button type="button" class="btn btn-sm btn-danger" data-act="cand-del" data-id="' + esc(c.id) + '">후보에서 삭제</button>' +
        '</div></div>';
    }).join('');
    if (!S.candidates.length) h += '<div class="card"><p>후보가 없습니다. 일정 항목을 ‘후보로 보내기’ 하면 여기에 쌓입니다.</p></div>';
    return h;
  }

  /* ---------------- 예약 ---------------- */
  function renderReservations() {
    var warns = C.checkReservations(S);
    var h = '<div class="card"><h2>예약정보 모음</h2><p class="small muted">교통·숙소·체험·보험을 한곳에 모았습니다. ‘증빙’은 확인용 서류, ‘입장·탑승 필요’는 실제로 제시해야 하는 문서입니다.</p></div>';

    var hardWarns = warns.filter(function (w) { return w.level !== 'info'; });
    var infoWarns = warns.filter(function (w) { return w.level === 'info'; });
    if (hardWarns.length || infoWarns.length) {
      h += '<div class="card"><h3>확인이 필요한 경고</h3>' + hardWarns.map(function (w) {
        return '<div class="notice ' + (w.level === 'danger' ? 'danger' : 'warn') + '">' + esc(w.text) + '</div>';
      }).join('');
      if (infoWarns.length) {
        h += '<div class="notice info">알림 미설정 ' + infoWarns.length + '건 — 이 앱은 휴대폰 알림을 실제로 설정하지 않았습니다. 필요한 알림은 캘린더 앱에서 직접 켜야 합니다.</div>';
      }
      h += '</div>';
    }

    ['transport', 'lodging', 'experience', 'insurance'].forEach(function (cat) {
      var list = S.reservations.filter(function (r) { return r.category === cat; });
      if (!list.length) return;
      h += '<h3 style="margin:16px 0 4px">' + CATEGORY_LABEL[cat] + '</h3>';
      h += list.map(function (r) {
        var st = RES_STATUS[r.status] || RES_STATUS.planned;
        return '<div class="card">' +
          '<div class="card-head"><div><h4>' + esc(r.title) + '</h4>' +
          '<p class="small muted">' + esc(r.provider || '') + (r.date ? ' · ' + esc(C.dateLabel(r.date, (C.findDay(S, r.date) || {}).weekday || '')) + (r.time ? ' ' + esc(r.time) : '') + (r.endTime ? '~' + esc(r.endTime) : '') : '') + '</p></div>' +
          '<span class="badge ' + st.cls + '">' + st.label + '</span></div>' +
          (r.route ? '<p class="small"><b>구간·장소</b> ' + esc(r.route) + '</p>' : '') +
          (r.details ? '<p class="small">' + esc(r.details) + '</p>' : '') +
          (r.docs && r.docs.length ? '<div class="tablewrap"><table><thead><tr><th>문서</th><th>종류</th><th>상태</th></tr></thead><tbody>' +
            r.docs.map(function (d) {
              return '<tr><td>' + esc(d.label) + (d.note ? '<br><span class="tiny">' + esc(d.note) + '</span>' : '') + '</td><td>' +
                (d.kind === 'proof' ? '증빙(확인용)' : '입장·탑승 필요') + '</td><td>' + esc(d.state) + '</td></tr>';
            }).join('') + '</tbody></table></div>' : '<p class="small muted">등록된 문서가 없습니다.</p>') +
          '<div class="badge-row"><span class="badge plain">알림: ' + esc(r.notify || '미설정') + '</span>' +
          (r.phone ? '<a class="btn btn-sm" href="tel:' + esc(r.phone.replace(/[^\d+]/g, '')) + '">' + esc(r.phone) + '</a>' : '') +
          (r.link ? '<a class="btn btn-sm" href="' + esc(r.link) + '" target="_blank" rel="noopener">공식·예약 페이지</a>' : '') + '</div>' +
          '</div>';
      }).join('');
    });

    h += '<div class="card"><h3>캘린더 파일(.ics) 저장</h3>' +
      '<p class="small">항공·숙소·체험 예약을 휴대폰 캘린더에 넣을 수 있는 파일을 내려받습니다. 이 앱은 알림을 실제로 설정하지 않으므로, 캘린더 앱에서 알림을 직접 켜야 합니다.</p>' +
      '<ol class="small"><li>아래 버튼을 눌러 .ics 파일을 저장합니다.</li>' +
      '<li>파일을 열면 캘린더 앱이 ‘일정 추가’ 화면을 띄웁니다(안 열리면 파일 앱에서 공유 → 캘린더).</li>' +
      '<li>일정마다 알림(예: 1시간 전)을 직접 켭니다.</li>' +
      '<li>시간은 일본 현지 시각 기준으로 넣었습니다.</li></ol>' +
      '<div class="row"><button type="button" class="btn btn-primary" data-act="ics">.ics 파일 내려받기</button></div>' +
      '<p class="hint">예약번호·이름은 파일에 넣지 않았습니다. 제목과 장소만 들어갑니다.</p></div>';

    return h;
  }

  /* ---------------- 예산 ---------------- */
  function renderBudget() {
    var b = S.budget;
    var t = C.budgetTotals(b);
    var h = '<div class="card"><div class="card-head"><div><h2>예산</h2><p class="small muted">결제 완료·미결제 예약·예상 지출·환불·금액 미확인을 구분해 계산합니다.</p></div>' +
      '<button type="button" class="btn btn-sm ' + (b.enabled ? 'btn-primary' : '') + '" data-act="budget-toggle" aria-pressed="' + b.enabled + '">' + (b.enabled ? '예산 사용 중' : '예산 사용 안 함') + '</button></div></div>';

    if (!b.enabled) {
      h += '<div class="banner info"><h4>예산 기능이 꺼져 있습니다</h4><p class="small">기록은 남아 있고 계산·표시만 숨깁니다. 다시 켜면 그대로 돌아옵니다.</p></div>';
      return h;
    }

    var paidUnknown = b.items.filter(function (x) { return x.status === 'paid' && (x.amount === null || x.amount === undefined); }).length;
    h += '<div class="kpis">' +
      '<div class="kpi"><div class="k">결제 완료</div><div class="v">' + C.fmtNum(t.krw.paid) + '<small>원</small></div>' +
      (paidUnknown ? '<div class="tiny">금액 미확인 ' + paidUnknown + '건 제외</div>' : '') + '</div>' +
      '<div class="kpi"><div class="k">미결제 예약</div><div class="v">' + C.fmtNum(t.krw.reserved) + '<small>원</small></div></div>' +
      '<div class="kpi"><div class="k">예상 지출</div><div class="v">' + C.fmtNum(t.krw.estimate) + '<small>원</small></div>' +
      (t.jpy.estimate ? '<div class="tiny">엔화 ' + C.fmtNum(t.jpy.estimate) + '엔 별도</div>' : '') + '</div>' +
      '<div class="kpi"><div class="k">원화 합계</div><div class="v">' + C.fmtNum(t.krw.net) + '<small>원</small></div></div>' +
      '<div class="kpi"><div class="k">엔화 합계</div><div class="v">' + C.fmtNum(t.jpy.net) + '<small>엔</small></div></div>' +
      '<div class="kpi' + (t.unknownCount ? ' warn' : '') + '"><div class="k">금액 미확인</div><div class="v">' + t.unknownCount + '<small>건</small></div></div>' +
      '<div class="kpi' + (t.overLimit ? ' danger' : '') + '"><div class="k">목표 대비 남은 금액</div><div class="v">' + (t.remainingKrw === null ? '환율 필요' : C.fmtNum(t.remainingKrw) + '<small>원</small>') + '</div></div>' +
      '<div class="kpi"><div class="k">환불 예정(확정)</div><div class="v">' + C.fmtNum(t.krw.refundConfirmed) + '<small>원</small></div></div>' +
      '</div>';

    if (t.unknownCount) {
      h += '<div class="banner warn"><h4>금액 미확인 ' + t.unknownCount + '건은 0원으로 계산하지 않았습니다</h4>' +
        '<p class="small">합계에서 빠져 있습니다: ' + esc(t.unknownLabels.join(', ')) + '</p></div>';
    }
    if (t.needsRate) {
      h += '<div class="banner info"><h4>엔화 항목은 환율을 입력해야 원화 목표와 비교됩니다</h4>' +
        '<p class="small">환율을 모르면 원화 합계와 엔화 합계를 따로 보세요. 임의의 환율을 넣지 않았습니다.</p></div>';
    }

    h += '<div class="card"><h3>목표 예산</h3>' + formBudgetSettings(t) + '</div>';

    h += '<div class="card"><div class="card-head"><h3>항목</h3><button type="button" class="btn btn-sm btn-primary" data-act="budget-add">+ 항목 추가</button></div>' +
      '<ul class="list-plain" style="margin-top:8px">' +
      b.items.map(function (it) {
        var st = C.STATUS_LABEL[it.status] || it.status;
        return '<li><div style="flex:1 1 200px;min-width:0">' +
          '<b>' + esc(it.label) + '</b><br>' +
          '<span class="small muted">' + esc(it.category || '기타') + ' · ' + esc(st) + '</span>' +
          (it.convertedFrom ? '<br><span class="tiny">예상 ' + C.fmtMoney(it.convertedFrom.amount, it.convertedFrom.currency) + ' → 실제로 전환됨(중복 합산 없음)</span>' : '') +
          (it.note ? '<br><span class="small">' + esc(it.note) + '</span>' : '') +
          (it.refundCondition ? '<br><span class="small" style="color:#8a4b00">환불 조건: ' + esc(it.refundCondition) + '</span>' : '') +
          '</div>' +
          '<span class="badge ' + (it.amount === null || it.status === 'unknown' ? 'needs_check' : it.status === 'refund' ? 'optional' : it.status === 'paid' ? 'confirmed' : 'planned') + '">' + esc(C.fmtMoney(it.amount, it.currency)) + '</span>' +
          '<div class="row tight">' +
          (it.status === 'estimate' ? '<button type="button" class="btn btn-sm" data-act="budget-convert" data-id="' + esc(it.id) + '">실제로 전환</button>' : '') +
          '<button type="button" class="btn btn-sm" data-act="budget-edit" data-id="' + esc(it.id) + '">수정</button>' +
          '<button type="button" class="btn btn-sm btn-danger" data-act="budget-del" data-id="' + esc(it.id) + '">삭제</button>' +
          '</div></li>';
      }).join('') + '</ul></div>';

    h += '<div class="card"><h3>분류별</h3><div class="tablewrap"><table><thead><tr><th>분류</th><th>원화</th><th>엔화</th></tr></thead><tbody>' +
      Object.keys(t.byCategory).map(function (k) {
        return '<tr><td>' + esc(k) + '</td><td>' + C.fmtNum(t.byCategory[k].krw) + '</td><td>' + C.fmtNum(t.byCategory[k].jpy) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="hint">환불 항목은 분류 합계에서 빠지고 ‘환불 예정’에 따로 더해집니다. 조건이 확인되지 않은 환불은 합계에 넣지 않습니다(항목에서 ‘환불 확정’ 체크).</p></div>';

    return h;
  }

  function formBudgetSettings(t) {
    return '<form id="budget-form">' +
      '<label for="b-target">목표 예산 (원)</label>' +
      '<input id="b-target" name="target" type="number" inputmode="numeric" min="0" step="10000" value="' + esc(S.budget.targetKrw || '') + '">' +
      '<label for="b-buffer">여유 한도 (%)</label>' +
      '<input id="b-buffer" name="buffer" type="number" inputmode="numeric" min="0" max="100" step="1" value="' + esc(S.budget.bufferPct || 0) + '">' +
      '<label for="b-rate">엔화 환율 (1엔 = ? 원, 모르면 비워 두기)</label>' +
      '<input id="b-rate" name="rate" type="number" inputmode="decimal" min="0" step="0.01" value="' + esc(S.budget.jpyRate === null ? '' : S.budget.jpyRate) + '">' +
      '<p class="hint">한도 ' + (t.limitKrw ? C.fmtNum(t.limitKrw) + '원' : '-') + ' · 여유 한도를 넘으면 표시가 바뀝니다.</p>' +
      '<button type="button" class="btn btn-primary" data-act="budget-settings-save" style="margin-top:6px">목표 저장</button>' +
      '</form>';
  }

  /* ---------------- 준비 ---------------- */
  function renderPrep() {
    var left = C.checklistLeft(S);
    var h = '<div class="card"><h2>준비물과 확인할 일</h2><p class="small muted">체크 상태는 자동 저장됩니다. 남은 확인사항은 여행 전에 하나씩 지워 가세요.</p></div>';

    h += '<div class="card"><div class="card-head"><h3>체크리스트 (' + (S.checklist.length - left.length) + '/' + S.checklist.length + ')</h3></div>' +
      S.checklist.map(function (k) {
        return '<div class="check ' + (k.done ? 'done' : '') + '"><input type="checkbox" id="ck-' + esc(k.id) + '" data-act="check-toggle" data-id="' + esc(k.id) + '"' + (k.done ? ' checked' : '') + '>' +
          '<span><label for="ck-' + esc(k.id) + '" style="margin:0;font-weight:600">' + esc(k.text) + '</label></span>' +

  function render(opts) {

    Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'), function (b) {
      if (b.getAttribute('data-tab') === tab) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    renderConflict();
    setSave(lastSaveError ? 'failed' : 'saved');
    if (opts.top) window.scrollTo(0, 0);
    else window.scrollTo(0, keepY);

  /* 화면 이동 같은 표시 설정은 충돌이 있어도 막지 않습니다(내용은 저장하지 않음). */
  function softCommit(mutator, opts) {
    var ok = commit(mutator, opts);
    if (!ok) {
      mutator(S);
      render(opts && opts.top ? { top: true } : undefined);
    }
    return ok;
  }

  function go(tab) {
    softCommit(function (st) { st.settings.tab = tab; }, { noRender: true });
    render({ top: true });
  }

  function applyItemForm(target, v) {

    target.time = v.time || '';

    target.address = v.address || '';
    target.phone = v.phone || '';
    target.hours = v.hours || '';

      mode: v.travelMode || '도보',

  function openItemEditor(itemId) {
    var day = C.dayOfItem(S, itemId);
    var it = C.findItem(S, itemId);
    if (!it) return;
    var fields = [{ name: 'date', label: '날짜', type: 'select', value: day.date, options: S.days.map(function (d) { return { value: d.date, label: C.dateLabel(d.date, d.weekday) + ' — ' + d.title }; }) }].concat(itemFields(it));
    openDlg({
      title: '일정 수정',
      body: formHtml(fields, '<p class="hint">날짜·순서·시각을 바꾸면 인접 이동시간이 ‘재조회 필요’로 표시됩니다.</p>'),
      actions: [{ label: '취소', act: 'close' }, { label: '저장', act: 'save-item', cls: 'btn-primary' }],
      onAction: function (act) {
        if (act === 'close') return closeDlg();
        if (act !== 'save-item') return;
        var v = readForm();
        var oldTimes = it.time + '|' + it.endTime;
        commit(function () {
          applyItemForm(it, v);
          if (v.date && v.date !== day.date) {
            var toDay = C.findDay(S, v.date);
            var at = day.items.indexOf(it);
            if (at >= 0) day.items.splice(at, 1);
            C.reindex(day);
            toDay.items.push(it);
            C.reindex(toDay);
            C.markAllTravelStale(day);
            C.markAllTravelStale(toDay);
          } else if (oldTimes !== (it.time + '|' + it.endTime)) {
            C.markTravelStale(day, day.items.indexOf(it));
          }
        });
        closeDlg();
        toast('수정했습니다.');
      }
    });
  }

  /* ---------------- 가져오기 ---------------- */
  function handleImportFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var res = C.parseBackupText(String(reader.result || ''));
      if (!res.ok) {
        openDlg({
          title: '가져올 수 없는 파일입니다',
          body: '<p>파일을 바꾸지 않고 그대로 두었습니다. 아래 이유를 확인하세요.</p><ul>' +
            res.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>',
          actions: [{ label: '닫기', act: 'close' }]
        });
        return;
      }
      pendingImport = { obj: JSON.parse(String(reader.result)), res: res };
      var s = res.summary;
      openDlg({
        title: '가져오기 전 확인',
        body: '<p class="small">내용을 확인한 뒤 적용 방식을 고르세요. 지금 상태는 자동으로 복구본에 저장해 둡니다.</p>' +
          '<ul class="small">' +
          '<li>여행 기간: ' + esc(s.tripStart) + ' ~ ' + esc(s.tripEnd) + '</li>' +
          '<li>일자 ' + s.days + '일 · 일정 항목 ' + s.items + '개</li>' +
          '<li>후보 ' + s.candidates + ' · 예약 ' + s.reservations + ' · 예산 ' + s.budgetItems + '</li>' +
          '<li>체크리스트 ' + s.checklist + ' · 확인사항 ' + s.confirmations + '</li>' +
          '<li>개인 메모 포함: ' + (s.hasPersonal ? '예 (적용하면 현재 개인 메모와 합칩니다)' : '아니오') + '</li>' +
          '<li>내보낸 시각: ' + esc(s.exportedAt || '기록 없음') + '</li>' +
          '</ul>' +
          (res.warnings.length ? '<div class="banner warn"><p class="small">' + res.warnings.map(esc).join('<br>') + '</p></div>' : '') +
          '<fieldset><legend>적용 방식</legend>' +
          '<label class="check"><input type="radio" name="mode" value="merge" checked><span><b>합치기</b> — id가 같은 항목은 그대로 두고 새 항목만 더합니다. 같은 이름이라도 id가 다르면 별개로 추가됩니다.</span></label>' +
          '<label class="check"><input type="radio" name="mode" value="replace"><span><b>전체 교체</b> — 지금 내용을 모두 지우고 파일 내용으로 바꿉니다. (자동 복구본을 먼저 만듭니다)</span></label>' +
          '</fieldset>',
        actions: [{ label: '취소', act: 'close' }, { label: '적용', act: 'import-apply', cls: 'btn-primary' }],
        onAction: function (act) {
          if (act === 'close') { pendingImport = null; return closeDlg(); }
          if (act !== 'import-apply' || !pendingImport) return;
          var modeEl = document.querySelector('input[name="mode"]:checked');
          var mode = modeEl ? modeEl.value : 'merge';
          applyImport(mode);
        }
      });
    };
    reader.readAsText(file);
  }

  function applyImport(mode) {
    var inc = pendingImport.obj.data || pendingImport.obj.state;
    var personalIn = pendingImport.obj.personal;
    var before = C.clone(S);
    var recovery = { at: new Date().toISOString(), mode: mode, state: before };
    safeSet(C.RECOVERY_KEY, JSON.stringify(recovery));

    var ok = commit(function (st) {
      if (mode === 'replace') {
        var next = C.applyReplace(st, inc);
        next.revision = st.revision;
        next.savedAt = st.savedAt;
        next.trash = st.trash;
        next.settings = st.settings;
        S = next;
      } else {
        var merged = C.mergeStates(st, inc);
        st.days = merged.state.days;
        st.candidates = merged.state.candidates;
        st.reservations = merged.state.reservations;
        st.budget = merged.state.budget;
        st.checklist = merged.state.checklist;
        st.confirmations = merged.state.confirmations;
      }
      if (personalIn && personalIn.items) {
        P.items = Object.assign({}, personalIn.items, P.items || {});
        savePersonal();
      }
    });
    pendingImport = null;
    closeDlg();
    if (ok) toast('가져왔습니다. 되돌리려면 ‘가져오기 취소’를 누르세요.', '가져오기 취소', 'import-undo');
  }

  /* ---------------- 다운로드 ---------------- */
  function download(filename, text, mime) {
    try {
      var blob = new Blob([text], { type: mime || 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return true;
    } catch (e) {
      toast('파일을 만들지 못했습니다: ' + e.message);
      return false;
    }
  }

  function stampName() {
    var d = new Date();
    return d.getFullYear() + C.pad(d.getMonth() + 1) + C.pad(d.getDate()) + '-' + C.pad(d.getHours()) + C.pad(d.getMinutes());
  }

  function utcStampNow() {
    var d = new Date();
    return d.getUTCFullYear() + C.pad(d.getUTCMonth() + 1) + C.pad(d.getUTCDate()) + 'T' +
      C.pad(d.getUTCHours()) + C.pad(d.getUTCMinutes()) + C.pad(d.getUTCSeconds()) + 'Z';
  }

  function exportJson(includePersonal) {
    var payload = C.exportPayload(S, P, includePersonal);
    download('osaka-trip-backup-' + stampName() + '.json', JSON.stringify(payload, null, 2), 'application/json');
    toast(includePersonal ? '개인 메모를 포함해 백업했습니다.' : '개인 메모를 제외하고 백업했습니다.');
  }

  /* ---------------- 이벤트 ---------------- */
  function handleClick(ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var id = t.getAttribute('data-id');

    switch (act) {
      case 'go':
        go(t.getAttribute('data-tab'));
        return;
      case 'view':
        softCommit(function (st) { st.settings.viewMode = t.getAttribute('data-mode'); }, { noRender: true });
        render({ top: true });
        return;
      case 'set-date':
        softCommit(function (st) { st.settings.activeDate = t.getAttribute('data-date'); }, { noRender: true });
        render({ top: true });
        return;
      case 'toggle-edit':
        softCommit(function (st) { st.settings.editMode = !st.settings.editMode; }, { noRender: true });
        render({ top: true });
        return;
      case 'toggle-hide':
        softCommit(function (st) { st.settings.hidePersonal = !st.settings.hidePersonal; });
        toast(S.settings.hidePersonal ? '개인 메모를 가립니다.' : '개인 메모를 표시합니다(화면을 보는 사람에게 노출).');
        return;
      case 'item-status':
        commit(function (st) { C.setItemStatus(st, id, t.getAttribute('data-status')); });
        return;
      case 'item-up':
      case 'item-down': {
        var day = C.dayOfItem(S, id);
        if (!day) return;
        var idx = day.items.map(function (x) { return x.id; }).indexOf(id);
        commit(function () { C.moveItemWithinDay(day, idx, act === 'item-up' ? 'up' : 'down'); });
        toast('순서를 바꿨습니다. 앞뒤 이동시간은 재조회가 필요합니다.');
        return;
      }
      case 'item-edit':
        openItemEditor(id);
        return;
      case 'item-add':
        openItemAdd();
        return;
      case 'item-del': {
        if (!guard('del:' + id, 900)) return;
        var payload = null;
        commit(function (st) { payload = C.removeItem(st, id); });
        if (payload) {
          toast('삭제했습니다. 휴지통에 보관됩니다.', '실행취소', 'undo-del', payload.entry.id);
        }
        return;
      }
      case 'undo-del':
        commit(function (st) { C.restoreTrash(st, t.getAttribute('data-payload')); });
        toast('되돌렸습니다.');
        return;
      case 'item-to-cand': {
        var it = C.findItem(S, id);
        if (!it) return;
        commit(function (st) {
          st.candidates.push({
            id: C.uid('c'), name: it.name, kind: it.kind, badge: 'optional', origin: it.origin || '일정에서 이동',
            stay: it.stay, address: it.address, phone: it.phone, hours: it.hours, booking: it.booking,
            note: it.note, details: it.details, travel: it.travel, access: it.access, links: it.links,
            reason: '일정에서 후보로 옮김'
          });
          C.removeItem(st, id);
        });
        toast('후보로 옮겼습니다.');
        return;
      }
      case 'cand-to-day':
        openCandToDay(id);
        return;
      case 'cand-del': {
        if (!guard('cdel:' + id, 900)) return;
        commit(function (st) {
          for (var i = 0; i < st.candidates.length; i++) {
            if (st.candidates[i].id === id) { st.candidates.splice(i, 1); break; }
          }
        });
        toast('후보에서 지웠습니다.');
        return;
      }
      case 'travel-reset': {
        var d2 = activeDay();
        commit(function () {
          d2.items.forEach(function (it2, i) {
            if (i > 0 && it2.travel) { it2.travel.source = '확인 필요'; it2.travel.stale = true; }
          });
        });
        toast('이 날 이동시간을 모두 ‘확인 필요’로 표시했습니다.');
        return;
      }
      case 'personal':
        openPersonal(id);
        return;
      case 'copy':
        copyText(t.getAttribute('data-copy'));
        return;
      case 'budget-toggle':
        commit(function (st) { st.budget.enabled = !st.budget.enabled; });
        return;
      case 'budget-add':
        openBudgetEditor(null);
        return;
      case 'budget-edit':
        openBudgetEditor(id);
        return;
      case 'budget-del': {
        if (!guard('bdel:' + id, 900)) return;
        commit(function (st) {
          st.budget.items = st.budget.items.filter(function (x) { return x.id !== id; });
        });
        toast('예산 항목을 지웠습니다.');
        return;
      }
      case 'budget-convert': {
        var item = S.budget.items.filter(function (x) { return x.id === id; })[0];
